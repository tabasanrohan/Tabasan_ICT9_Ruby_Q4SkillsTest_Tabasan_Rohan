<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Notebook</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #eef2f7;
}

/* Login box */
.login-box {
    max-width: 400px;
    margin: 100px auto;
    padding: 30px;
    border-radius: 15px;
    background: white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Notebook cards */
.card {
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

/* Hide notebooks at start */
#notebookPage {
    display: none;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-box text-center">
    <h2>Login</h2>

    <input type="text" id="username" class="form-control mb-3" placeholder="Username">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary" onclick="login()">Login</button>
</div>

<!-- NOTEBOOK PAGE -->
<div id="notebookPage" class="container mt-5">

    <h1 class="text-center mb-4">My Notebooks</h1>

    <div class="row">

        <!-- Notebook 1 -->
        <div class="col-md-4">
            <div class="card p-3">
                <h4>Filipino</h4>
                <p>Teacher: Ms. Francisco</p>
                <button class="btn btn-success" onclick="openNotebook('Filipino')">Open</button>
            </div>
        </div>

        <!-- Notebook 2 -->
        <div class="col-md-4">
            <div class="card p-3">
                <h4>English</h4>
                <p>Teacher: Ms. Avila</p>
                <button class="btn btn-success" onclick="openNotebook('English')">Open</button>
            </div>
        </div>

        <!-- Notebook 3 -->
        <div class="col-md-4">
            <div class="card p-3">
                <h4>Math</h4>
                <p>Teacher: Mr. Verba</p>
                <button class="btn btn-success" onclick="openNotebook('Math')">Open</button>
            </div>
        </div>

    </div>

    <div class="row mt-4">
        <div class="col text-center">
            <button class="btn btn-primary" onclick="countSubjects()">Show Subjects</button>
            <p id="output"></p>
        </div>
    </div>

</div>

<script>

// LOGIN FUNCTION (Condition + Event)
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    // Condition
    if(user === "admin" && pass === "1234") {
        alert("Login successful!");

        // Show notebook page
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("notebookPage").style.display = "block";

    } else {
        alert("Invalid login!");
    }
}

// FUNCTION (Event)
function openNotebook(subject) {
    alert("Opening " + subject + " notebook");
}

// LOOP + VARIABLES + OUTPUT
function countSubjects() {
    let subjects = ["Filipino", "English", "Math", "Science", "Social Studies"];
    let text = "";

    // Loop
    for(let i = 0; i < subjects.length; i++) {
        text += subjects[i] + "<br>";
    }

    // Output
    document.getElementById("output").innerHTML = text;
}

</script>

</body>
</html>
