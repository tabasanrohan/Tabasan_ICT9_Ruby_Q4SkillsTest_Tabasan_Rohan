<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Notebook</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-image: url('https://i.pinimg.com/1200x/92/1c/5f/921c5f526afe3211ae7d9afa6798efd1.jpg');
    background-size: cover;
    font-family: Helvetica;
background-repeat: no-repeat;
}


.card {
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="notebookPage" class="container mt-5">

    <h1 class="text-center mb-4">My Notebooks</h1>

    <div class="row">


        <div class="col-md-4">
            <div class="card p-3">
         <h4>Filipino</h4>
                <p>Teacher: Ms. Francisco</p>
             <button class="btn btn-success" onclick="openNotebook('Filipino')">Open</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
          <h4>English</h4>
                <p>Teacher: Ms. Avila</p>
           <button class="btn btn-success" onclick="openNotebook('English')">Open</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h4>Math</h4>
      <p>Teacher: Mr. Verba</p>
                <button class="btn btn-success" onclick="openNotebook('Math')">Open</button>
            </div>
        </div>

            <div class="col-md-4">
            <div class="card p-3">
                <h4>Science</h4>
      <p>Teacher: Ms. Mendaro</p>
                <button class="btn btn-success" onclick="openNotebook('Science')">Open</button>
            </div>
        </div>



            <div class="col-md-4">
            <div class="card p-3">
                <h4>ICT</h4>
      <p>Teacher: Mr. Santos</p>
                <button class="btn btn-success" onclick="openNotebook('ICT')">Open</button>
            </div>
        </div>

    </div>
    <div class="row mt-4">
        <div class="col text-center">
            <button class="btn btn-primary" onclick="countSubjects()">Show Subjects</button>
            <p id="output"></p>
        </div>
    </div>

</div>

<script>


function openNotebook(subject) {
    alert("Opening " + subject + " notebook");
}

function countSubjects() {
    let subjects = ["Filipino", "English", "Math", "Science", "ICT"];
    let text = "";

    for(let i = 0; i < subjects.length; i++) {
        text += subjects[i] + "<br>";
    }

    document.getElementById("output").innerHTML = text;
}

</script>

</body>
</html>
